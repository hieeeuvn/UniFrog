# UniFrog game overlay pak: a GBA-style frame drawn over the game.
#
# Select it on the device: Config -> Custom -> Game Overlay -> GBA Frame.
# image is a PNG inside this folder, drawn at full screen size. Pixels with
# alpha below 128 are left alone, so the transparent middle is the game.
# frame.png is 320x240 with 13px bands top and bottom, which is exactly the
# letterbox a 240x160 GBA image gets on this screen.
title=GBA Frame
image=frame.png
