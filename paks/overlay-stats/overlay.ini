# UniFrog game overlay pak. Shown over gameplay, not launched as an app.
#
# Select it on the device: Config -> Custom -> Game Overlay -> Stats.
# position: top-left, top-right, bottom-left, bottom-right.
# line1..line4 hold up to three tokens each, separated by commas:
#   clock, battery, achievements, game, points
title=Stats
position=top-right
line1=clock
line2=battery
line3=achievements
