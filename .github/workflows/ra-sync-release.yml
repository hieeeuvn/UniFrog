name: RA Sync release (Windows + Android)

on:
  push:
    tags:
      - 'rasync-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Android/versionName (e.g. 1.0)
        required: false
        default: '1.0'
      version_code:
        description: Android/versionCode (integer)
        required: false
        default: '1'
      release_title:
        description: Prerelease title (defaults to tag name)
        required: false
      release_notes:
        description: Release notes body
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install packages
        run: apk add git make dtc tcc tcc-libs-static gcc perl musl-dev zlib-dev ccache curl tar xz zip patch

      - name: Check out UniFrog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Configure Git
        run: |
          set -eu
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/unifrog-gitconfig"
          git config --global --add safe.directory "$PWD"
          git config --global user.name "UniFrog CI"
          git config --global user.email "ci@unifrog.local"
          git config --global \
            url."https://github.com/axgdev/frog2k-qpsx.git".insteadOf \
            "git@github.com:axgdev/frog2k-qpsx.git"
          git config --global \
            url."https://github.com/axgdev/frog2k-javascript.git".insteadOf \
            "git@github.com:axgdev/frog2k-javascript.git"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Verify build ref
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          git describe --tags --always --dirty
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve release metadata
        id: meta
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if [ -z "${{ github.event.inputs.release_title }}" ]; then
            title="$tag"
          else
            title="${{ github.event.inputs.release_title }}"
          fi
          notes="${{ github.event.inputs.release_notes }}"
          if [ -z "$notes" ]; then
            notes="Auto-built RA Sync clients for ${tag}."
          fi
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'is_tag=%s\n' "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Windows clients
        run: |
          sh tools/ra-sync-gui/windows/build_windows.sh
        env:
          ZIG: ${{ github.workspace }}/.deps/zig-linux-x86_64-0.13.0/zig

      - name: Build Android APK
        run: |
          sh tools/ra-sync-gui/android/build_android.sh
        env:
          JAVA_HOME: ${{ github.workspace }}/.deps/jdk-17.0.21+9
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.deps/android-sdk
          ANDROID_NDK_ROOT: ${{ github.workspace }}/.deps/android-sdk/ndk/26.1.10909125
          RA_SYNC_VERSION_NAME: ${{ github.event.inputs.version_name }}
          RA_SYNC_VERSION_CODE: ${{ github.event.inputs.version_code }}

      - name: Package release artifacts
        run: |
          set -eu
          dist=tools/ra-sync-gui/dist
          mkdir -p release-artifacts
          cp "$dist"/UniFrog-RA-Sync-32.exe \
             "$dist"/UniFrog-RA-Sync-64.exe \
             "$dist"/UniFrog-RA-Sync.apk \
             release-artifacts/
          (cd release-artifacts && sha256sum *) > release-artifacts/SHA256SUMS
          ls -l release-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ra-sync-${{ steps.meta.outputs.tag }}
          path: release-artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.notes }}
          draft: false
          prerelease: true
          files: release-artifacts/*
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

      - name: Publish workflow dispatch prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rasync-${{ github.run_id }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.notes }}
          draft: false
          prerelease: true
          files: release-artifacts/*
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
